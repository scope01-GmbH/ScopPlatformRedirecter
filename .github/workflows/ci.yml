name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHPUnit (Shopware ${{ matrix.shopware-version }} / PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Lowest version allowed by composer.json (shopware/core ^6.7.4)
          - shopware-version: v6.7.4.0
            php-version: '8.3'
          # Previous Shopware patch release
          - shopware-version: v6.7.15.1
            php-version: '8.4'
          - shopware-version: v6.7.15.1
            php-version: '8.5'
          - shopware-version: v6.7.16.1
            php-version: '8.5'

    steps:
      - name: Setup Shopware
        uses: shopware/setup-shopware@main
        with:
          env: test
          shopware-version: ${{ matrix.shopware-version }}
          php-version: ${{ matrix.php-version }}
          install: true
          # Pinned Shopware tags lock packages that later received security advisories, which
          # Composer now refuses to install. Fine for a throwaway test environment.
          allow-insecure-versions: true

      # Checked out after Shopware, because setup-shopware clones Shopware into the workspace root
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: custom/plugins/ScopPlatformRedirecter

      - name: Refresh plugin list
        run: php bin/console plugin:refresh

      # The TestBootstrap force-installs and activates the plugin
      - name: Run PHPUnit
        working-directory: custom/plugins/ScopPlatformRedirecter
        run: php ../../../vendor/bin/phpunit

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - name: Setup Shopware
        uses: shopware/setup-shopware@main
        with:
          shopware-version: v6.7.15.1
          php-version: '8.4'
          install: false
          allow-insecure-versions: true

      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: custom/plugins/ScopPlatformRedirecter

      # Installed separately and pinned, so the result does not depend on Shopware's own PHPStan
      # setup and the baseline stays valid. Bump together with phpstan-baseline.neon.
      - name: Install PHPStan
        run: |
          mkdir -p "$RUNNER_TEMP/phpstan"
          cd "$RUNNER_TEMP/phpstan"
          echo '{}' > composer.json
          composer config allow-plugins.phpstan/extension-installer true
          composer require phpstan/phpstan:2.3.5 phpstan/extension-installer --no-interaction --no-progress

      # Shopware's dev dependencies register PHPStan extensions (strict and deprecation rules) through
      # their own extension list, which PHPStan loads via Shopware's autoloader. Replace it with our
      # empty list, so CI checks the same rules as a local run against a normal Shopware install.
      - name: Disable Shopware's PHPStan extensions
        run: |
          target=vendor/phpstan/extension-installer/src/GeneratedConfig.php
          if [ -f "$target" ]; then
            cp "$RUNNER_TEMP/phpstan/vendor/phpstan/extension-installer/src/GeneratedConfig.php" "$target"
          fi

      - name: Run PHPStan
        working-directory: custom/plugins/ScopPlatformRedirecter
        run: >
          "$RUNNER_TEMP/phpstan/vendor/bin/phpstan" analyse
          -c phpstan.neon.dist
          --autoload-file=../../../vendor/autoload.php
          --no-progress
          --memory-limit=1G
          --error-format=github
